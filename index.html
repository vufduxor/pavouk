<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 – teplota a vlhkost</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1c1f24;--mu:#6b7280;--bd:#e3e6ea;--ok:#1a9d55;--bad:#d93a3a;--ac:#2f6fed;--ac2:#e08a1e}
@media (prefers-color-scheme:dark){:root{--bg:#14171b;--card:#1d2127;--tx:#e8eaed;--mu:#9aa3ad;--bd:#2c323a;--ok:#3ccf7f;--bad:#ff6b6b;--ac:#6c9cff;--ac2:#f0a64a}}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:14px}
h1{font-size:20px;margin:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.lbl{color:var(--mu);font-size:13px}
.big{font-size:44px;font-weight:650;line-height:1.1}
.big small{font-size:20px;font-weight:500;color:var(--mu)}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;border:1px solid var(--bd);color:var(--mu)}
.badge.on{color:var(--ok);border-color:var(--ok)}
.badge.bad{color:var(--bad);border-color:var(--bad)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mu);margin-right:6px}
.on .dot{background:var(--ok)}.bad .dot{background:var(--bad)}
svg{width:100%;height:70px;display:block;margin-top:8px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
label{display:grid;gap:4px;font-size:13px;color:var(--mu)}
input{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);width:100%}
button{font:inherit;padding:9px 16px;border:0;border-radius:8px;background:var(--ac);color:#fff;cursor:pointer}
details summary{cursor:pointer;color:var(--mu)}
#msg{font-size:14px;color:var(--mu);min-height:20px}
</style>
</head>
<body>
<div class="wrap">
  <div class="row">
    <h1>Teplota a vlhkost</h1>
    <div><span id="esp" class="badge"><span class="dot"></span>ESP32: ?</span>
         <span id="conn" class="badge"><span class="dot"></span>Broker</span></div>
  </div>

  <div class="grid">
    <div class="card" id="ct">
      <div class="lbl">Teplota</div>
      <div class="big"><span id="t">–</span><small> °C</small></div>
      <div id="at" class="lbl">–</div>
      <svg id="st" viewBox="0 0 300 70" preserveAspectRatio="none"></svg>
      <div class="lbl">rozsah: <span id="str">–</span></div>
    </div>
    <div class="card" id="ch">
      <div class="lbl">Vlhkost</div>
      <div class="big"><span id="h">–</span><small> %</small></div>
      <div id="ah" class="lbl">–</div>
      <svg id="sh" viewBox="0 0 300 70" preserveAspectRatio="none"></svg>
      <div class="lbl">rozsah: <span id="shr">–</span></div>
    </div>
  </div>
  <div class="lbl">Poslední data: <span id="ago">–</span> · Wi-Fi signál: <span id="rssi">–</span> dBm · Doba běhu: <span id="up">–</span></div>

  <div class="card">
    <div class="row"><strong>Nastavení</strong><span class="lbl">ukládá se přímo do ESP32</span></div>
    <form id="f" onsubmit="return false" style="margin-top:12px">
      <label>Teplota min (°C)<input id="tmin" type="number" step="0.5"></label>
      <label>Teplota max (°C)<input id="tmax" type="number" step="0.5"></label>
      <label>Vlhkost min (%)<input id="hmin" type="number" step="1"></label>
      <label>Vlhkost max (%)<input id="hmax" type="number" step="1"></label>
      <label>Offset teploty (°C)<input id="ot" type="number" step="0.1"></label>
      <label>Offset vlhkosti (%)<input id="oh" type="number" step="0.5"></label>
      <label>Interval odesílání (s)<input id="int" type="number" min="2" max="3600" step="1"></label>
    </form>
    <div class="row" style="margin-top:12px"><button id="save">Uložit do ESP32</button><span id="msg"></span></div>
  </div>

  <div class="card">
    <details>
      <summary>Připojení</summary>
      <form onsubmit="return false" style="margin-top:12px">
        <label>ID zařízení (DEVICE_ID)<input id="dev" placeholder="esp32dht-k7q2x9"></label>
        <label>Broker (WebSocket)<input id="broker"></label>
        <label>Uživatel (volitelně)<input id="usr" autocomplete="off"></label>
        <label>Heslo (volitelně)<input id="pwd" type="password" autocomplete="off"></label>
      </form>
      <div style="margin-top:12px"><button id="go">Připojit</button></div>
    </details>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const KEYS = ['tmin','tmax','hmin','hmax','ot','oh','int'];
let client = null, base = '', hist = [], lastTs = 0, saving = false;

function store(k, v) {
  try { if (v === undefined) return localStorage.getItem(k) || ''; localStorage.setItem(k, v); } catch (e) { return ''; }
}
$('broker').value = store('broker') || 'wss://broker.hivemq.com:8884/mqtt';
$('dev').value = store('dev');
$('usr').value = store('usr');

function badge(el, text, cls) { el.className = 'badge ' + cls; el.innerHTML = '<span class="dot"></span>' + text; }
function setEsp(on) { badge($('esp'), 'ESP32: ' + (on ? 'online' : 'offline'), on ? 'on' : 'bad'); }
function setConn(text, on) { badge($('conn'), text, on ? 'on' : 'bad'); }
function msg(t) { $('msg').textContent = t; }

function spark(id, arr, color) {
  const el = $(id);
  if (arr.length < 2) { el.innerHTML = ''; return; }
  const w = 300, h = 70, p = 6;
  const mn = Math.min(...arr), mx = Math.max(...arr), r = (mx - mn) || 1;
  const pts = arr.map((v, i) =>
    (p + i / (arr.length - 1) * (w - 2 * p)).toFixed(1) + ',' + (h - p - (v - mn) / r * (h - 2 * p)).toFixed(1)).join(' ');
  el.innerHTML = '<polyline points="' + pts + '" fill="none" style="stroke:' + color +
    '" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>';
  $(id + 'r').textContent = mn.toFixed(1) + ' – ' + mx.toFixed(1);
}

function alarmText(el, card, state, unit) {
  const map = { ok: 'V normě', low: 'Pod minimem', high: 'Nad maximem' };
  el.textContent = map[state] || '–';
  el.style.color = state === 'ok' ? 'var(--ok)' : (state ? 'var(--bad)' : '');
  card.style.borderColor = (state && state !== 'ok') ? 'var(--bad)' : '';
}

function onData(d) {
  $('t').textContent = Number(d.t).toFixed(1);
  $('h').textContent = Number(d.h).toFixed(1);
  alarmText($('at'), $('ct'), d.alt);
  alarmText($('ah'), $('ch'), d.alh);
  $('rssi').textContent = d.rssi;
  const s = d.up, hh = Math.floor(s / 3600), mm = Math.floor(s % 3600 / 60);
  $('up').textContent = hh + ' h ' + mm + ' min';
  lastTs = Date.now();
  hist.push({ t: d.t, h: d.h });
  if (hist.length > 120) hist.shift();
  spark('st', hist.map(x => x.t), 'var(--ac)');
  spark('sh', hist.map(x => x.h), 'var(--ac2)');
}

function onSettings(s) {
  KEYS.forEach(k => { if (s[k] !== undefined && document.activeElement !== $(k)) $(k).value = s[k]; });
  if (saving) { msg('Uloženo v ESP32 ✓'); saving = false; }
}

function connect() {
  const id = $('dev').value.trim();
  if (!id) { setConn('Zadej ID zařízení', false); return; }
  ['broker', 'dev', 'usr'].forEach(k => store(k, $(k).value));
  if (client) client.end(true);
  base = id + '/'; hist = [];
  client = mqtt.connect($('broker').value.trim(), {
    username: $('usr').value || undefined,
    password: $('pwd').value || undefined,
    clientId: 'web-' + Math.random().toString(16).slice(2, 10),
    reconnectPeriod: 3000
  });
  client.on('connect', () => {
    setConn('Broker: připojeno', true);
    client.subscribe([base + 'data', base + 'status', base + 'settings']);
  });
  client.on('close', () => setConn('Broker: odpojeno', false));
  client.on('error', e => setConn('Chyba: ' + e.message, false));
  client.on('message', (topic, m) => {
    const key = topic.slice(base.length), s = m.toString();
    try {
      if (key === 'status') setEsp(s === 'online');
      else if (key === 'data') onData(JSON.parse(s));
      else if (key === 'settings') onSettings(JSON.parse(s));
    } catch (e) { console.warn('Špatná zpráva', topic, s); }
  });
}

$('go').onclick = connect;
$('save').onclick = () => {
  if (!client || !client.connected) { msg('Nejdřív se připoj k brokeru.'); return; }
  const ti = Number($('int').value);
  if ($('int').value !== '' && (ti < 2 || ti > 3600)) { msg('Interval musí být 2–3600 s.'); return; }
  saving = true;
  KEYS.forEach(k => { if ($(k).value !== '') client.publish(base + 'set/' + k, String($(k).value)); });
  msg('Odesláno, čekám na potvrzení z ESP32…');
};

setInterval(() => {
  $('ago').textContent = lastTs ? 'před ' + Math.round((Date.now() - lastTs) / 1000) + ' s' : '–';
}, 1000);

if ($('dev').value) connect();
</script>
</body>
</html>
